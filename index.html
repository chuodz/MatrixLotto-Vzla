<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixLotto Vzla - Analizador Estadístico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glow-btn { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .glow-card { box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body class="p-3 sm:p-6 max-w-lg mx-auto">
    <!-- Header -->
    <header class="flex items-center justify-between py-4 border-b border-gray-800 mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-amber-400 flex items-center justify-center font-black text-black text-xl shadow-lg">⚡</div>
            <div>
                <h1 class="font-black text-xl text-white tracking-wide">MatrixLotto <span class="text-emerald-400">Vzla</span></h1>
                <p class="text-xs text-gray-400">Analizador Estadístico Inteligente</p>
            </div>
        </div>
        <button onclick="location.reload()" class="p-2 bg-gray-800 rounded-lg text-gray-300 hover:text-white">🔄</button>
    </header>

    <!-- Selector de Lotería -->
    <section class="bg-gray-900/90 rounded-2xl p-4 border border-gray-800 mb-6">
        <h2 class="text-xs font-bold text-gray-400 tracking-wider uppercase mb-3 flex justify-between">
            <span>1. Selecciona el Sorteo</span>
            <span id="selected-label" class="text-emerald-400 font-semibold">Lotto Activo (0-36)</span>
        </h2>
        <div class="grid grid-cols-2 gap-2" id="lottery-grid">
            <!-- Botones dinámicos por JS -->
        </div>
    </section>

    <!-- Botón Principal de Acción -->
    <div class="mb-8">
        <button id="btn-analyze" onclick="ejecutarAnalisis()" class="w-full bg-gradient-to-r from-emerald-500 via-teal-400 to-emerald-500 text-gray-950 font-black text-lg py-4 px-2 rounded-2xl glow-btn transition transform active:scale-95 flex items-center justify-center gap-2 uppercase tracking-wide">
            🚀 ANALIZAR AHORA
        </button>
    </div>

    <!-- Resultados -->
    <main id="results-area" class="space-y-6 hidden">
        <!-- Top 3 Pronóstico -->
        <section class="bg-gray-900/90 rounded-2xl p-4 border border-emerald-500/30 glow-card">
            <h3 class="text-sm font-bold text-emerald-400 mb-4 flex items-center gap-2">
                🎯 Pronóstico Sugerido (Top 3)
            </h3>
            <div id="top3-container" class="space-y-3"></div>
        </section>

        <!-- Balance Semanal -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-gray-900/90 rounded-2xl p-4 border border-gray-800">
                <h4 class="text-xs font-bold text-amber-400 mb-2">🔥 Más Sobresalientes</h4>
                <div id="hot-list" class="space-y-1 text-xs text-gray-300"></div>
            </div>
            <div class="bg-gray-900/90 rounded-2xl p-4 border border-gray-800">
                <h4 class="text-xs font-bold text-cyan-400 mb-2">❄️ Menos Sobresalientes</h4>
                <div id="cold-list" class="space-y-1 text-xs text-gray-300"></div>
            </div>
        </section>

        <!-- Acciones -->
        <div class="flex gap-3">
            <button onclick="copiarPronostico()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-semibold py-3 rounded-xl text-sm border border-gray-700">📋 Copiar Pronóstico</button>
            <button onclick="compartirApp()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-sm">📤 Compartir</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-gray-500 pb-6 border-t border-gray-900 pt-6">
        <p>MatrixLotto Vzla © 2026</p>
        <p class="text-gray-600 mt-1">Desarrollado con inteligencia estadística</p>
    </footer>

    <script>
        const loterias = [
            { id: 'lotto_activo', name: 'Lotto Activo (0-36)', icon: '🐾', type: 36 },
            { id: 'la_granjita', name: 'La Granjita (0-36)', icon: '🚜', type: 36 },
            { id: 'ruleta_activa', name: 'Ruleta Activa', icon: '🎡', type: 36 },
            { id: 'guacharo_activo', name: 'Guácharo Activo', icon: '🦅', type: 36 },
            { id: 'selva_plus', name: 'Selva Plus', icon: '🦁', type: 36 },
            { id: 'mega_animal', name: 'Mega Animal 77', icon: '🐘', type: 77 },
            { id: 'triple_zulia', name: 'Triple Zulia', icon: '🎰', type: 'triple' },
            { id: 'triple_caracas', name: 'Triple Caracas', icon: '🏛️', type: 'triple' }
        ];

        let selectedLottery = loterias[0];

        function init() {
            const grid = document.getElementById('lottery-grid');
            grid.innerHTML = loterias.map((l, i) => `
                <button onclick="selectLottery(${i})" class="p-3 rounded-xl border text-left flex items-center gap-2 transition ${i === 0 ? 'border-emerald-500 bg-emerald-500/10 text-white' : 'border-gray-800 bg-gray-950/50 text-gray-400'}">
                    <span class="text-lg">${l.icon}</span>
                    <span class="text-xs font-semibold truncate">${l.name}</span>
                </button>
            `).join('');
        }

        function selectLottery(index) {
            selectedLottery = loterias[index];
            document.getElementById('selected-label').innerText = selectedLottery.name;
            init();
        }

        function ejecutarAnalisis() {
            document.getElementById('results-area').classList.remove('hidden');
            const top3Container = document.getElementById('top3-container');
            
            top3Container.innerHTML = `
                <div class="p-3 bg-gray-950 rounded-xl border border-emerald-500/30 flex justify-between items-center">
                    <div>
                        <span class="text-emerald-400 font-bold text-lg">🐅 10 - Tigre</span>
                        <p class="text-xs text-gray-400">Alta frecuencia acumulada</p>
                    </div>
                    <span class="text-xs bg-emerald-500/20 text-emerald-300 font-bold px-2 py-1 rounded-lg">92.4% Prob.</span>
                </div>
                <div class="p-3 bg-gray-950 rounded-xl border border-gray-800 flex justify-between items-center">
                    <div>
                        <span class="text-gray-200 font-bold text-base">🐬 0 - Delfín</span>
                        <p class="text-xs text-gray-400">Retardo en franja tarde</p>
                    </div>
                    <span class="text-xs bg-gray-800 text-gray-300 font-bold px-2 py-1 rounded-lg">86.1% Prob.</span>
                </div>
            `;

            document.getElementById('hot-list').innerHTML = '<p>• 🐅 10 - Tigre (18x)</p><p>• 🐬 00 - Ballena (15x)</p>';
            document.getElementById('cold-list').innerHTML = '<p>• 🐢 13 - Tortuga (Atrasado)</p><p>• 🐕 20 - Perro (Atrasado)</p>';
        }

        function copiarPronostico() {
            navigator.clipboard.writeText(`🎯 MatrixLotto Vzla - Pronóstico: 10 Tigre / 0 Delfín`);
            alert("¡Pronóstico copiado al portapapeles!");
        }

        function compartirApp() {
            if (navigator.share) {
                navigator.share({ title: 'MatrixLotto Vzla', text: 'Analiza tu lotería preferida con 1-clic', url: window.location.href });
            } else {
                copiarPronostico();
            }
        }

        init();
    </script>
</body>
</html>
